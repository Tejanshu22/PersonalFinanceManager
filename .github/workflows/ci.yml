name: Tracker and repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check feature and roadmap manifests
        run: python scripts/validate_manifest.py
      - name: Run tracker tests
        run: python -m unittest discover -s tests -v
